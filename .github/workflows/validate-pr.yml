name: Validate pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The Dockerfile runs both backend and frontend tests before building.
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: downloadarr-pr:check
          build-args: BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the image revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' downloadarr-pr:check)" = "$EXPECTED_REVISION"
