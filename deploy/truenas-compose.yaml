# TrueNAS 25.10: Apps > Discover Apps > menu > Install via YAML.
# Replace NAS_LAN_IP and downloads.example.com. App name: librarydownloadarr.
# Progress image c13399c; 45 tests pass. Builds on the successful 85505d0 pilot.
services:
  librarydownloadarr:
    image: ghcr.io/hloiseau/librarydownloadarr@sha256:2ce1026be6c86110a48e918175abe76df4ab4b0bd81628a144a0361858361992
    restart: unless-stopped
    ports:
      - "NAS_LAN_IP:5070:5069"
    environment:
      NODE_ENV: production
      PORT: "5069"
      DATABASE_PATH: /app/data/librarydownloadarr.db
      LOG_LEVEL: info
      TZ: Europe/Paris
      CORS_ORIGIN: https://downloads.example.com
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
  app-logs:
