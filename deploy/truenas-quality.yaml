# TrueNAS 25.10: Apps > Discover > menu > Install via YAML.
# Replace the image digest, NAS_LAN_IP and the two dataset paths before saving.
# This preview uses a separate port and data directory from any existing app.
services:
  librarydownloadarr-quality:
    image: ghcr.io/hloiseau/librarydownloadarr:quality-preview
    restart: unless-stopped
    ports:
      - "NAS_LAN_IP:5070:5069"
    environment:
      NODE_ENV: production
      PORT: "5069"
      DATABASE_PATH: /app/data/librarydownloadarr.db
      LOG_LEVEL: info
      TZ: Europe/Paris
    volumes:
      - /mnt/POOL/apps/librarydownloadarr-quality/data:/app/data
      - /mnt/POOL/apps/librarydownloadarr-quality/logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 45s
# Plex keeps the media and the Intel A310. This app needs no media mount,
# GPU mapping, privileged mode or Docker socket.
